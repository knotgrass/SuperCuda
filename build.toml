# kernel-builder config (https://huggingface.co/docs/kernels/builder/writing-kernels).
# This is the only source list: torch-ext/matmul/_ops.py reads it for the dev (JIT) build,
# and kernel-builder reads it for Hub builds.

[general]
name = "matmul"
version = 1
edition = 6
backends = ["cuda"]

[torch]
src = [
  "torch-ext/torch_binding.cpp",
  "torch-ext/torch_binding.h",
]
include = ["include"]

[kernel.matmul]
language = "cpp-cuda"
depends = ["torch"]
src = [
  # one .cu + .cuh per kernel: the kernel and its raw launcher
  "matmul_cuda/naive.cu",
  "matmul_cuda/naive.cuh",
  # the Torch ops: one per kernel, each calls its launcher
  "matmul_cuda/ops.cu",
]
include = ["include"]
