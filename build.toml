# kernel-builder config (https://huggingface.co/docs/kernels/builder/writing-kernels).
# This is the only source list: torch-ext/gemm/_ops.py reads it for the dev (JIT) build,
# and kernel-builder reads it for Hub builds.

[general]
name = "gemm"
version = 1
edition = 6
backends = ["cuda"]

[torch]
src = [
  "torch-ext/torch_binding.cpp",
  "torch-ext/torch_binding.h",
]
include = ["include"]

[kernel.gemm]
language = "cpp-cuda"
depends = ["torch"]
src = [
  # one .cu + .cuh per kernel: the kernel and its raw launcher
  "csrc/gemm/naive.cu",
  "csrc/gemm/naive.cuh",
  # the Torch ops: one per kernel, each calls its launcher
  "torch-ext/ops.cu",
]
# csrc/gemm: ops.cu includes the launcher headers ("naive.cuh")
include = ["include", "csrc/gemm"]
